<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a1a">
  <title>Administración — Reportes Cartagena</title>
  <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin>
  <link rel="stylesheet" href="lib/leaflet.css">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="admin-body">

  <!-- Login -->
  <section id="pantallaLogin" class="login-pantalla">
    <form id="formLogin" class="login-form" autocomplete="on">
      <h1 class="login-titulo">Administración</h1>
      <p class="login-subtitulo">Reportes Ciudadanos — Cartagena</p>
      <div class="login-campo">
        <label for="loginUsuario" class="campo-label">Usuario</label>
        <input type="text" id="loginUsuario" name="usuario" class="campo-input" autocomplete="username" required>
      </div>
      <div class="login-campo">
        <label for="loginClave" class="campo-label">Contraseña</label>
        <input type="password" id="loginClave" name="clave" class="campo-input" autocomplete="current-password" required>
      </div>
      <div id="loginError" class="login-error" role="alert" hidden></div>
      <button type="submit" class="btn btn--primario login-btn">Iniciar sesión</button>
    </form>
  </section>

  <!-- Consola admin (oculta hasta login) -->
  <section id="consolaAdmin" class="admin-consola" hidden>
    <!-- Sidebar -->
    <nav class="admin-sidebar" aria-label="Navegación de administración">
      <div class="sidebar-cabecera">
        <h2 class="sidebar-titulo">Panel Admin</h2>
        <button id="btnCerrarSesion" class="btn btn--texto sidebar-cerrar" aria-label="Cerrar sesión">Salir</button>
      </div>
      <ul class="sidebar-nav">
        <li>
          <button class="sidebar-enlace active" data-seccion="incidencias" aria-current="page">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M2 4h14M2 9h14M2 14h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            Incidencias
          </button>
        </li>
        <li>
          <button class="sidebar-enlace" data-seccion="cortes">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M9 2v14M4 7l5-5 5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Cortes programados
          </button>
        </li>
        <li>
          <button class="sidebar-enlace" data-seccion="estadisticas">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><rect x="1" y="10" width="3" height="6" rx="0.5" fill="currentColor"/><rect x="7" y="5" width="3" height="11" rx="0.5" fill="currentColor"/><rect x="13" y="2" width="3" height="14" rx="0.5" fill="currentColor"/></svg>
            Estadísticas
          </button>
        </li>
        <li>
          <button class="sidebar-enlace" data-seccion="bitacora">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><rect x="2" y="2" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M5 6h8M5 9h6M5 12h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
            Bitácora
          </button>
        </li>
      </ul>
    </nav>

    <!-- Botón hamburguesa mobile -->
    <button id="btnMenuAdmin" class="admin-menu-toggle" aria-label="Abrir menú" aria-expanded="false">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>

    <!-- Contenido principal -->
    <main class="admin-main">
      <!-- Sección incidencias -->

      <div id="seccionIncidencias" class="admin-seccion active" data-seccion="incidencias">
        <h2 class="seccion-titulo">Incidencias</h2>
        <div class="admin-filtros">
          <select id="adminFiltroServicio" class="filtro-select" aria-label="Filtrar por servicio">
            <option value="">Todos los servicios</option>
          </select>
          <select id="adminFiltroEstado" class="filtro-select" aria-label="Filtrar por estado">
            <option value="">Todos los estados</option>
            <option value="Reportado">Reportado</option>
            <option value="Solucionado">Solucionado</option>
            <option value="Archivado">Archivado</option>
          </select>
          <input type="date" id="adminFiltroDesde" class="filtro-select" aria-label="Desde">
          <input type="date" id="adminFiltroHasta" class="filtro-select" aria-label="Hasta">
          <button id="adminBtnFiltrar" class="btn btn--primario btn--sm">Filtrar</button>
        </div>
        <div class="tabla-contenedor">
          <table class="admin-tabla" id="tablaIncidencias">
            <thead>
              <tr>
                <th>Código</th>
                <th>Servicio</th>
                <th>Estado</th>
                <th>Barrio</th>
                <th>Fecha</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tbodyIncidencias"></tbody>
          </table>
        </div>
        <div id="paginacionIncidencias" class="paginacion"></div>
      </div>

      <!-- Sección cortes -->

      <div id="seccionCortes" class="admin-seccion" data-seccion="cortes">
        <h2 class="seccion-titulo">Cortes Programados</h2>
        <div class="cortes-layout">
          <div class="cortes-lista" id="cortesLista">
            <!-- lista inyectada por JS -->
          </div>
          <div class="cortes-formulario">
            <h3 class="form-subtitulo">Registrar nuevo corte</h3>
            <form id="formCorte" class="form-vertical">
              <div class="campo">
                <label for="corteServicio" class="campo-label">Servicio</label>
                <select id="corteServicio" class="campo-input" required></select>
              </div>
              <div class="campo">
                <label for="corteEmpresa" class="campo-label">Empresa</label>
                <select id="corteEmpresa" class="campo-input" required></select>
              </div>
              <div class="campo">
                <label for="corteFechaInicio" class="campo-label">Fecha/hora inicio</label>
                <input type="datetime-local" id="corteFechaInicio" class="campo-input" required>
              </div>
              <div class="campo">
                <label for="corteFechaFin" class="campo-label">Fecha/hora fin</label>
                <input type="datetime-local" id="corteFechaFin" class="campo-input" required>
              </div>
              <div class="campo">
                <label for="corteMotivo" class="campo-label">Motivo</label>
                <select id="corteMotivo" class="campo-input" required>
                  <option value="mantenimiento">Mantenimiento</option>
                  <option value="racionamiento">Racionamiento</option>
                </select>
              </div>
              <div class="campo">
                <label for="corteDescripcion" class="campo-label">Descripción</label>
                <textarea id="corteDescripcion" class="campo-input campo-textarea" rows="3" required></textarea>
              </div>
              <div class="campo">
                <label class="campo-label">Ubicación</label>
                <div id="corteMapaMini" class="mapa-mini"></div>
              </div>
              <button type="submit" class="btn btn--primario">Registrar corte</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Sección estadísticas -->

      <div id="seccionEstadisticas" class="admin-seccion" data-seccion="estadisticas">
        <h2 class="seccion-titulo">Estadísticas</h2>
        <div class="admin-filtros">
          <input type="date" id="estadDesde" class="filtro-select" aria-label="Desde">
          <input type="date" id="estadHasta" class="filtro-select" aria-label="Hasta">
          <button id="btnCalcularEstad" class="btn btn--primario btn--sm">Calcular</button>
          <button id="btnExportarCsv" class="btn btn--secundario btn--sm">Exportar CSV</button>
        </div>
        <div id="estadContenido" class="estad-contenido">
          <!-- charts inyectados por JS -->
        </div>
      </div>

      <!-- Sección bitácora -->

      <div id="seccionBitacora" class="admin-seccion" data-seccion="bitacora">
        <h2 class="seccion-titulo">Bitácora de Auditoría</h2>
        <div class="tabla-contenedor">
          <table class="admin-tabla" id="tablaBitacora">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Usuario</th>
                <th>Acción</th>
                <th>Entidad</th>
                <th>Detalle</th>
              </tr>
            </thead>
            <tbody id="tbodyBitacora"></tbody>
          </table>
        </div>
      </div>
    </main>
  </section>

  <!-- Modal admin -->
  <div id="adminModal" class="modal-overlay" aria-hidden="true">
    <div class="modal-panel" role="dialog" aria-modal="true">
      <div class="modal-contenido" id="adminModalContenido"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="contenedorToast" class="toast-contenedor" aria-live="assertive"></div>

  <!-- Spinner -->
  <div id="spinner" class="spinner-overlay" aria-hidden="true">
    <div class="spinner" role="progressbar" aria-label="Cargando"></div>
  </div>

  <script src="lib/leaflet.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
